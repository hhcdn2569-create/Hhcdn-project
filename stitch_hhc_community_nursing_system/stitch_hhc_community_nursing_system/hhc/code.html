<body class="font-body-md text-body-md mb-20 md:mb-0 md:pt-16">

<header class="fixed top-0 w-full z-50 bg-surface dark:bg-surface-dim shadow-sm flex items-center justify-between px-margin-mobile h-16 w-full">

<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center overflow-hidden">
<img alt="Hospital Logo" class="w-full h-full object-cover" data-alt="A professional medical logo icon featuring a stylized caduceus and healing cross, rendered in deep navy blue and medical teal against a clean white circular background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBGchRZxpezkxRytbeAehlkXD-w9XqjcrBUZNgA5aZRiAC3oR5HAiXxzQeV4iDezoe7DRRFe6-kTGHIYeRe-kJDnQ6c8XRnekRiKYzY5nSVw5RBnf3u2YIt_-zrcCm9JQlH84bV_p2MhnwuuqwOlBlHfA32olfnz58hah6cVafgYDy91PuT1T1f3BOz9aja50-arxdqVwm-HDZzgZk3zCnXXJtA4R0bDOmtZstyRYXXWXfy5QkmoyMfISBtjF82T82c6YCzeE7WwK4"/>
</div>
<h1 class="font-headline-md text-[18px] md:text-headline-md-mobile font-bold text-primary dark:text-primary-fixed-dim">Somdet Phra Sangharaj HHC</h1>
</div>
<button class="material-symbols-outlined text-primary dark:text-primary-fixed-dim p-2 hover:bg-surface-container-high transition-colors rounded-full active:opacity-80">account_circle</button>
</header>
<main class="max-w-[800px] mx-auto px-margin-mobile py-8 mt-16 md:mt-0">
<!-- Breadcrumb / Section Title -->
<div class="mb-8">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary mb-2">ระบบบันทึกข้อมูล HHC (กลุ่มงานพยาบาลชุมชน)</h2>
<p class="text-on-surface-variant font-body-md">Home Health Care Data Entry</p>
</div>
<!-- Entry Form Card -->
<form class="space-y-gutter bg-surface-container-lowest p-6 md:p-8 rounded-xl shadow-[0px_2px_8px_rgba(27,61,109,0.08)]" id="hhc-form">
<!-- Bento Grid Section 1: Basic Info -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<!-- Date Field -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="visit-date">วันที่รับบริการ</label>
<div class="relative">
<input class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-bright form-input-focus transition-all" id="visit-date" placeholder="เลือกวันที่" required="" type="date"/>
</div>
</div>
<!-- HN Field -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="hn-number">เลขที่บัตรผู้ป่วย (HN)</label>
<input class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-bright form-input-focus transition-all" id="hn-number" placeholder="เช่น 66000123" required="" type="text"/>
</div>
</div>
<!-- Department Section -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="department">หน่วยงาน/แผนก</label>
<select class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-bright form-input-focus transition-all appearance-none cursor-pointer" id="department" onchange="toggleOther(this.value)">
<option disabled="" selected="" value="">เลือกหน่วยงาน</option>
<option value="ER">ER</option>
<option value="OPD">OPD</option>
<option value="ICU">ICU</option>
<option value="กุมาร">กุมาร</option>
<option value="ORT">ORT</option>
<option value="ศัลยกรรม">ศัลยกรรม</option>
<option value="นรีเวช">นรีเวช</option>
<option value="จักษุ">จักษุ</option>
<option value="Stroke">Stroke</option>
<option value="ฉ.2">ฉ.2</option>
<option value="ฉ.3">ฉ.3</option>
<option value="ฉ.4">ฉ.4</option>
<option value="ฉ.5">ฉ.5</option>
<option value="ฉ.6">ฉ.6</option>
<option value="ฉ.7">ฉ.7</option>
<option value="อายุรกรรม (ชาย)">อายุรกรรม (ชาย)</option>
<option value="อายุรกรรม (หญิง)">อายุรกรรม (หญิง)</option>
<option value="อื่นๆ">อื่นๆ (ระบุเพิ่มเติม)</option>
</select>
</div>
<!-- Other Department Text Area -->
<div class="hidden flex flex-col gap-2 animate-in fade-in slide-in-from-top-2 duration-300" id="other-dept-container">
<label class="font-label-md text-label-md text-on-surface" for="other-dept">ระบุหน่วยงานอื่น ๆ</label>
<textarea class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-bright form-input-focus transition-all" id="other-dept" placeholder="โปรดระบุ..." rows="2"></textarea>
</div>
<!-- Diagnosis Section -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="diagnosis">คำวินิจฉัย (Diagnosis)</label>
<textarea class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-bright form-input-focus transition-all" id="diagnosis" placeholder="ระบุรายละเอียดอาการและการวินิจฉัย..." required="" rows="4"></textarea>
</div>
<!-- File Upload Section -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface">แนบรูปภาพประกอบ</label>
<div class="relative border-2 border-dashed border-outline-variant rounded-xl p-8 flex flex-col items-center justify-center gap-3 bg-tertiary-container/5 hover:bg-tertiary-container/10 transition-all cursor-pointer group" id="drop-zone">
<input accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" id="file-upload" multiple="" type="file"/>
<div class="w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">add_a_photo</span>
</div>
<div class="text-center">
<p class="font-label-md text-on-surface">คลิกเพื่ออัปโหลด หรือลากไฟล์มาวางที่นี่</p>
<p class="text-label-sm text-on-surface-variant mt-1">PNG, JPG, HEIC (สูงสุด 10MB)</p>
</div>
<div class="mt-4 flex flex-wrap gap-2" id="preview-container"></div>
</div>
</div>
<!-- Submit Button Area -->
<div class="pt-4">
<button class="w-full md:w-auto md:min-w-[200px] bg-primary-container text-white py-4 px-8 rounded-xl font-headline-md text-headline-md-mobile hover:bg-primary transition-all active:scale-[0.98] shadow-md flex items-center justify-center gap-2" type="submit">
<span class="material-symbols-outlined">save</span>
                    บันทึกข้อมูล
                </button>
</div>

</main>
<!-- BottomNavBar (Visible on Mobile) -->
<nav class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-2 pb-safe bg-surface-container dark:bg-surface-container-lowest shadow-[0px_-2px_8px_rgba(27,61,109,0.08)]">
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-tertiary-container px-4 py-1 hover:bg-surface-variant/50 transition-all active:scale-95 duration-200" href="#">
<span class="material-symbols-outlined">home</span>
<span class="font-label-sm text-label-sm">หน้าหลัก</span>
</a>
<a class="flex flex-col items-center justify-center bg-secondary-container dark:bg-secondary text-on-secondary-container dark:text-on-secondary rounded-xl px-4 py-1 active:scale-95 transition-transform duration-200" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">edit_note</span>
<span class="font-label-sm text-label-sm">บันทึก</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-tertiary-container px-4 py-1 hover:bg-surface-variant/50 transition-all active:scale-95 duration-200" href="#">
<span class="material-symbols-outlined">dashboard</span>
<span class="font-label-sm text-label-sm">แดชบอร์ด</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-tertiary-container px-4 py-1 hover:bg-surface-variant/50 transition-all active:scale-95 duration-200" href="#">
<span class="material-symbols-outlined">history</span>
<span class="font-label-sm text-label-sm">ประวัติ</span>
</a>
</nav>
<!-- Success Toast (Hidden by default) -->
<div class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-on-secondary-container text-white px-6 py-3 rounded-full shadow-lg flex items-center gap-2 transform translate-y-20 opacity-0 transition-all duration-300 z-[100]" id="success-toast">
<span class="material-symbols-outlined">check_circle</span>
<span class="font-label-md">บันทึกข้อมูลสำเร็จ</span>
</div>
<script>
        // Toggle "Other" Department Field
        function toggleOther(value) {
            const container = document.getElementById('other-dept-container');
            if (value === 'อื่นๆ') {
                container.classList.remove('hidden');
                document.getElementById('other-dept').setAttribute('required', 'true');
            } else {
                container.classList.add('hidden');
                document.getElementById('other-dept').removeAttribute('required');
            }
        }

        // Image Preview Logic
        const fileInput = document.getElementById('file-upload');
        const previewContainer = document.getElementById('preview-container');
        const dropZone = document.getElementById('drop-zone');

        fileInput.addEventListener('change', function(e) {
            handleFiles(this.files);
        });

        // Drag and Drop Effects
        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropZone.classList.add('upload-zone-active');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropZone.classList.remove('upload-zone-active');
            }, false);
        });

        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFiles(files);
        });

        function handleFiles(files) {
            previewContainer.innerHTML = '';
            [...files].forEach(file => {
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const div = document.createElement('div');
                        div.className = 'relative w-20 h-20 rounded-lg overflow-hidden border border-outline-variant';
                        div.innerHTML = `<img src="${e.target.result}" class="w-full h-full object-cover">`;
                        previewContainer.appendChild(div);
                    }
                    reader.readAsDataURL(file);
                }
            });
        }

        // Form Submission Intercept
        document.getElementById('hhc-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Interaction Feedback
            const toast = document.getElementById('success-toast');
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
                toast.classList.remove('translate-y-0', 'opacity-100');
                this.reset();
                previewContainer.innerHTML = '';
                document.getElementById('other-dept-container').classList.add('hidden');
                const today = new Date().toISOString().split('T')[0];
                document.getElementById('visit-date').value = today;
            }, 3000);
        });

        // Set default date to today
        window.onload = () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('visit-date').value = today;
        };
    </script>
</body></html>
